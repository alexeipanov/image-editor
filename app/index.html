<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Image Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <div id="defaultNotification" class="notification hidden">
    <p>Default notification message</p>
    <div class="close"></div>
  </div>

  <header></header>

  <section class="app">
    <aside>
      <sidebar v-bind:panel.sync="panel"></sidebar>
    </aside>

    <main>
      <toolbar v-bind:panel.sync="panel"></toolbar>
      <canvas id="editor"></canvas>
      <div>

      </div>
    </main>

  </section>

  <footer class="x12">
    <div class="copyright">&copy; 2018 <a href="mailto:windstarter@gmail.com">Alexei Panov</a></div>
    <div class="footer-menu">
      <nav>
        <ul>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Feedback</a></li>
        </ul>
      </nav>
    </div>
    <div class="social">
      links
    </div>
    <div class="subscribe">
      <form class="inline" action="#">
        <input type="text" name="" placeholder="your@email.com"><button type="submit">Subscribe</button>
      </form>
    </div>
  </footer>
  <script src="app.js"></script>

  <template id="toolbar">
    <nav class="bar">
      <ul>
        <li class="icon-button" @click="openPanel('new')"><svg class="icon"><use href="images/icons.svg#file"></use></svg></li>
        <li class="icon-button" @click="undo"><svg class="icon"><use href="images/icons.svg#undo"></use></svg></li>
        <li class="icon-button" @click="redo"><svg class="icon"><use href="images/icons.svg#redo"></use></svg></li>
        <li class="icon-button" @click="remove"><svg class="icon"><use href="images/icons.svg#times"></use></svg></li>
        <li class="icon-button" @click="openPanel('text')"><svg class="icon"><use href="images/icons.svg#font"></use></svg></li>
        <li class="icon-button" @click="openPanel('image')"><svg class="icon"><use href="images/icons.svg#image"></use></svg></li>
        <li class="icon-button" @click="openPanel('background')"><svg class="icon"><use href="images/icons.svg#palette"></use></svg></li>
        <li class="icon-button" @click="openPanel('icon')"><svg class="icon"><use href="images/icons.svg#icons"></use></svg></li>
      </ul>
    </nav>
  </template>

  <template id="sidebar">
    <div class="accordion">
      <div class="panel">
        <div class="header" @click="openPanel('new')">New</div>
        <div class="body" v-if="panel === 'new'">
          <select v-model="size">
            <option value="800x536">Business Card</option>
            <option value="618x800">Flyer</option>
            <option value="566x800">A4</option>
            <option value="800x800">Square</option>
            <option value="820x312">Facebook Cover</option>
          </select>
          <button @click="newDrawing(size)">Create</button>
        </div>
      </div>
      <div class="panel">
        <div class="header" v-on:click="openPanel('text')">Text</div>
        <div class="body" v-if="panel === 'text'">
          <div class="flex-column">
            <div class="flex-row">
              <textarea cols="40" rows="4"></textarea>
            </div>
            <div class="flex-row">
              <div class="element-group">
                <label for="font">Font</label>
                <select id="font">
                  <option value="Roboto">Roboto</option>
                </select>
              </div>
              <div class="element-group">
                <label for="size">Size</label>
                <select id="font">
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12" selected>12</option>
                  <option value="14">14</option>
                  <option value="16">16</option>
                  <option value="18">18</option>
                  <option value="18">18</option>
                  <option value="20">20</option>
                  <option value="24">24</option>
                  <option value="36">36</option>
                  <option value="48">48</option>
                  <option value="64">64</option>
                  <option value="72">72</option>
                </select>
              </div>
              <div class="element-group">
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#bold"></use></svg></div>
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#italic"></use></svg></div>
              </div>
              <div class="element-group">
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#align-left"></use></svg></div>
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#align-center"></use></svg></div>
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#align-right"></use></svg></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel image">
        <div class="header" v-on:click="openPanel('image')">Images</div>
        <div class="body" v-if="panel === 'image'">
          <div class="flex-row">
            <div class="image-list">
              <img src="images/courtney-corlew-472715.jpg" class="active">
              <img src="images/everaldo-coelho-486015.jpg">
              <img src="images/willian-justen-de-vasconcellos-507620.jpg">
              <img src="images/gleb-kozenko-262704.jpg">
            </div>
          </div>
          <div class="flex-row start">
            <input @change="addImages" type="file" accept="image/*" ref="imageInput" multiple>
            <button @click="uploadImages">Upload</button>
            <button class="bright">Use</button>
          </div>
        </div>
      </div>
      <div class="panel background">
        <div class="header" v-on:click="openPanel('background')">Background</div>
        <div class="body" v-if="panel === 'background'">
          <div class="flex-row">
            <div class="image-list">
              <img src="images/joe-woods-4Zaq5xY5M_c.jpg" class="active">
              <img src="images/vincent-burkhead-LhlxYMfnTF0.jpg">
              <img src="images/w-qjCHPZbeXCQ.jpg">
              <img src="images/jj-ying-7JX0-bfiuxQ.jpg">
            </div>
          </div>
          <div class="flex-row">
            <input @change="addImages" type="file" accept="image/*" ref="imageInput" multiple>
            <button @click="uploadImages">Upload</button>
          </div>
          <div class="flex-row">
            <div class="color"></div>
          </div>
          <div class="flex-row">
            <button class="bright">Use</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="header" v-on:click="openPanel('icon')">Icons</div>
        <div class="body" v-if="panel === 'icon'">
          <div class="flex-row">
            <div class="icon-list">
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#behance"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#facebook"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#github"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#instagram"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#linkedin"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#pinterest"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#reddit"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#snapchat"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#soundcloud"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#strava"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#twitter"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#vimeo"></use></svg>
              </div>
              <div class="icon-cell">
                <svg class="icon"><use href="images/icons.svg#youtube"></use></svg>
              </div>
            </div>
          </div>
        <div class="flex-row start">
          <button class="bright">Use</button>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
