<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Image Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <div id="defaultNotification" class="notification hidden">
    <p>Default notification message</p>
    <div class="close"></div>
  </div>

  <header></header>

  <section class="app">
    <aside>
      <sidebar v-bind:panel.sync="panel"></sidebar>
    </aside>

    <main>
      <toolbar v-bind:panel.sync="panel"></toolbar>
      <canvas id="editor"></canvas>
      <div>

      </div>
    </main>

  </section>

  <footer class="x12">
    <div class="copyright">&copy; 2021 <a href="mailto:windstarter@gmail.com">Alexei Panov</a></div>
    <div class="footer-menu">
      <nav>
        <ul>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Feedback</a></li>
        </ul>
      </nav>
    </div>
    <div class="social">
      links
    </div>
    <div class="subscribe">
      <form class="inline" action="#">
        <input type="text" name="" placeholder="your@email.com"><button type="submit">Subscribe</button>
      </form>
    </div>
  </footer>
  <script src="app.js"></script>

  <template id="toolbar">
    <nav class="bar">
      <ul>
        <li class="icon-button" @click="openPanel('new')"><svg class="icon"><use href="images/icons.svg#file"></use></svg></li>
        <li class="icon-button" @click="undo"><svg class="icon"><use href="images/icons.svg#undo"></use></svg></li>
        <li class="icon-button" @click="redo"><svg class="icon"><use href="images/icons.svg#redo"></use></svg></li>
        <li class="icon-button" @click="remove"><svg class="icon"><use href="images/icons.svg#times"></use></svg></li>
        <li class="icon-button" @click="openPanel('text')"><svg class="icon"><use href="images/icons.svg#font"></use></svg></li>
        <li class="icon-button" @click="openPanel('image')"><svg class="icon"><use href="images/icons.svg#image"></use></svg></li>
        <li class="icon-button" @click="openPanel('background')"><svg class="icon"><use href="images/icons.svg#palette"></use></svg></li>
        <li class="icon-button" @click="openPanel('icon')"><svg class="icon"><use href="images/icons.svg#icons"></use></svg></li>
      </ul>
    </nav>
  </template>

  <template id="sidebar">
    <div class="accordion">
      <div class="panel">
        <div class="header" @click="openPanel('new')">New</div>
        <div class="body" v-if="panel === 'new'">
          <select v-model="selectedSize">
            <option v-for="size in sizeList" :value="size.size">{{size.name}}</option>
          </select>
          <button @click="newDrawing(selectedSize)">Create</button>
        </div>
      </div>
      <div class="panel">
        <div class="header" v-on:click="openPanel('text')">Text</div>
        <div class="body" v-if="panel === 'text'">
          <div class="flex-column">
            <div class="flex-row">
              <textarea cols="40" rows="4"></textarea>
            </div>
            <div class="flex-row">
              <div class="element-group">
                <label for="font">Font</label>
                <select id="font">
                  <option value="Roboto">Roboto</option>
                </select>
              </div>
              <div class="element-group">
                <label for="size">Size</label>
                <select id="font">
                  <option v-for="size in fontSizes" value="size" :selected="isSelected(size, fontSize)">{{size}}</option>
                </select>
              </div>
              <div class="element-group">
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#bold"></use></svg></div>
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#italic"></use></svg></div>
              </div>
              <div class="element-group">
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#align-left"></use></svg></div>
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#align-center"></use></svg></div>
                <div class="icon-button small"><svg class="icon"><use href="images/icons.svg#align-right"></use></svg></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel image">
        <div class="header" v-on:click="openPanel('image')">Images</div>
        <div class="body" v-if="panel === 'image'">
          <div class="flex-row">
            <div class="image-list">
              <img v-for="image in imageList" :src="'images/' + image" :class="{ active: isSelected(image, selectedImage) }" @click="selectedImage = image">
            </div>
          </div>
          <div class="flex-row start">
            <input @change="addImages" type="file" accept="image/*" ref="imageInput" multiple>
            <button @click="uploadImages">Upload</button>
            <button class="bright">Use</button>
          </div>
        </div>
      </div>
      <div class="panel background">
        <div class="header" v-on:click="openPanel('background')">Background</div>
        <div class="body" v-if="panel === 'background'">
          <div class="flex-row">
            <div class="image-list">
              <img v-for="background in backgroundList" :src="'images/' + background" :class="{ active: isSelected(background, selectedBackground) }" @click="selectedBackground = background">
            </div>
          </div>
          <div class="flex-row">
            <input @change="addBackgrounds" type="file" accept="image/*" ref="imageInput" multiple>
            <button @click="uploadImages">Upload</button>
          </div>
          <div class="flex-row">
            <div class="color"></div>
          </div>
          <div class="flex-row">
            <button class="bright">Use</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="header" v-on:click="openPanel('icon')">Icons</div>
        <div class="body" v-if="panel === 'icon'">
          <div class="flex-row">
            <div class="icon-list">
              <div class="icon-cell" v-for="icon in iconList" :class="{ active: isSelected(icon, selectedIcon) }" @click="selectedIcon = icon">
                <svg class="icon"><use :href="'images/icons.svg#' + icon"></use></svg>
              </div>
            </div>
          </div>
        <div class="flex-row start">
          <button class="bright">Use</button>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
