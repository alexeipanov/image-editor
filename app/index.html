<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Image Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <div id="defaultNotification" class="notification hidden">
    <p>Default notification message</p>
    <div class="close"></div>
  </div>

  <header></header>

  <section class="app">
    <aside>
      <sidebar v-bind:panel.sync="panel"></sidebar>
    </aside>

    <main>
      <toolbar v-bind:panel.sync="panel"></toolbar>
      <canvas id="editor"></canvas>
      <div>

      </div>
    </main>

  </section>

  <footer class="x12">
    <div class="copyright">&copy; 2021 <a href="mailto:windstarter@gmail.com">Alexei Panov</a></div>
    <div class="footer-menu">
      <nav>
        <ul>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Feedback</a></li>
        </ul>
      </nav>
    </div>
    <div class="social">
      links
    </div>
    <div class="subscribe">
      <form class="inline" action="#">
        <input type="text" name="" placeholder="your@email.com"><button type="submit">Subscribe</button>
      </form>
    </div>
  </footer>
  <script src="app.js"></script>

  <template id="toolbar">
    <nav class="bar">
      <ul>
        <li class="icon-button" @click="openPanel('new')"><svg class="icon"><use href="images/icons.svg#file"></use></svg></li>
        <li class="icon-button" @click="undo"><svg class="icon"><use href="images/icons.svg#undo"></use></svg></li>
        <li class="icon-button" @click="redo"><svg class="icon"><use href="images/icons.svg#redo"></use></svg></li>
        <li class="icon-button accent" @click="remove"><svg class="icon"><use href="images/icons.svg#times"></use></svg></li>
        <li class="icon-button" @click="openPanel('text')"><svg class="icon"><use href="images/icons.svg#font"></use></svg></li>
        <li class="icon-button" @click="openPanel('image')"><svg class="icon"><use href="images/icons.svg#image"></use></svg></li>
        <li class="icon-button" @click="openPanel('background')"><svg class="icon"><use href="images/icons.svg#palette"></use></svg></li>
        <li class="icon-button" @click="openPanel('icon')"><svg class="icon"><use href="images/icons.svg#icons"></use></svg></li>
      </ul>
    </nav>
  </template>

  <template id="sidebar">
    <div class="accordion">
      <div class="panel" :class="{ active: isSelected(panel, 'new') }">
        <div class="header" @click="openPanel('new')">New</div>
        <div class="body" v-if="panel === 'new'">
          <select v-model="selectedSize">
            <option v-for="size in sizeList" :value="size.size">{{size.name}}</option>
          </select>
          <button @click="newDrawing(selectedSize)">Create</button>
        </div>
      </div>

      <div class="panel" :class="{ active: isSelected(panel, 'text') }">
        <div class="header" @click="openPanel('text')">Text</div>
        <div class="body" v-if="panel === 'text'">
          <div class="flex-column">
            <div class="flex-row">
              <textarea cols="40" rows="4" v-model="store.TextProperties.text"></textarea>
            </div>
            <div class="flex-row">
              <div class="element-group">
                <label for="font">Font</label>
                <select id="font" v-model="store.TextProperties.fontFamily">
                  <option v-for="font in store.fonts" :value=font.name>{{font.name}}</option>
                </select>
              </div>
              <div class="element-group">
                <label for="size">Size</label>
                <select id="size" v-model="store.TextProperties.fontSize">
                  <option v-for="size in store.sizes" :value=size :selected="isSelected(size, store.TextProperties.fontSize)">{{size}}</option>
                </select>
              </div>
              <div class="element-group">
                <button class="icon-button small" :disabled=!font.isRegular() :class="{ 'is-active': store.TextProperties.fontStyle === 'normal' }" @click="store.TextProperties.fontStyle = 'normal'">
                  <svg class="icon"><use href="images/icons.svg#font"></use></svg>
                </button>
                <button class="icon-button small" :disabled=!font.isItalic() :class="{ 'is-active': store.TextProperties.fontStyle === 'italic' }" @click="store.TextProperties.fontStyle = 'italic'">
                  <svg class="icon"><use href="images/icons.svg#italic"></use></svg>
                </button>
              </div>
              <div class="element-group">
                <button class="icon-button small" :class="{ 'is-active': store.TextProperties.textAlign === 'left' }" @click="store.TextProperties.textAlign = 'left'">
                  <svg class="icon"><use href="images/icons.svg#align-left"></use></svg>
                </button>
                <button class="icon-button small" :class="{ 'is-active': store.TextProperties.textAlign === 'center' }" @click="store.TextProperties.textAlign = 'center'">
                  <svg class="icon"><use href="images/icons.svg#align-center"></use></svg>
                </button>
                <button class="icon-button small" :class="{ 'is-active': store.TextProperties.textAlign === 'right' }" @click="store.TextProperties.textAlign = 'right'">
                  <svg class="icon"><use href="images/icons.svg#align-right"></use></svg>
                </button>
              </div>
            </div>
            <div class="flex-row">
              <div class="element-group">
                <label for="weight">Weight</label>
                <select id="weight" v-model="store.TextProperties.fontWeight">
                  <option v-for="weight in font.weights" :value=weight :selected="isSelected(weight, store.TextProperties.fontWeight)">{{weight}}</option>
                </select>
              </div>
            </div>
            <div class="flex-row">
              <div class="element-group">
                <button @click="addText()">Add</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel image" :class="{ active: isSelected(panel, 'image') }">
        <div class="header" @click="openPanel('image')">Images</div>
        <div class="body" v-if="panel === 'image'">
          <div class="flex-row">
            <div class="image-list">
              <img v-for="image in imageList" :src="'images/' + image" :class="{ active: isSelected(image, selectedImage) }" @click="selectedImage = image">
            </div>
          </div>
          <div class="flex-row start">
            <input @change="addImages" type="file" accept="image/*" ref="imageInput" multiple>
            <button @click="uploadImages">Upload</button>
            <button class="bright">Use</button>
          </div>
        </div>
      </div>

      <div class="panel background" :class="{ active: isSelected(panel, 'background') }">
        <div class="header" @click="openPanel('background')">Background</div>
        <div class="body" v-if="panel === 'background'">
          <div class="flex-row">
            <div class="image-list">
              <img v-for="background in backgroundList" :src="'images/' + background" :class="{ active: isSelected(background, selectedBackground) }" @click="selectedBackground = background">
            </div>
          </div>
          <div class="flex-row">
            <input @change="addBackgrounds" type="file" accept="image/*" ref="imageInput" multiple>
            <button @click="uploadImages">Upload</button>
          </div>
          <div class="flex-row">
            <div class="color"></div>
          </div>
          <div class="flex-row">
            <button class="bright">Use</button>
          </div>
        </div>
      </div>

      <div class="panel" :class="{ active: isSelected(panel, 'icon') }">
        <div class="header" @click="openPanel('icon')">Icons</div>
        <div class="body" v-if="panel === 'icon'">
          <div class="flex-row">
            <div class="icon-list">
              <div class="icon-cell" v-for="icon in iconList" :class="{ active: isSelected(icon, selectedIcon) }" @click="selectedIcon = icon">
                <svg class="icon"><use :href="'images/icons.svg#' + icon"></use></svg>
              </div>
            </div>
          </div>
        <div class="flex-row start">
          <button class="bright">Use</button>
        </div>
      </div>
    </div>
  </template>

</body>
</html>
